# RecoverAI — Render blueprint.
#
# Deployed as a NATIVE NODE service, not Docker. packages/backend/Dockerfile
# stays in the repo for docker-compose and local parity; Render does not use
# it. Do not set `runtime: docker` here as well — pick one.
#
# Every value marked `sync: false` must be entered in the Render dashboard.
# No secret is committed to this file.
services:
  # ---------------------------------------------------------------------------
  # Backend — Fastify API
  # ---------------------------------------------------------------------------
  - type: web
    name: recoverai-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    # The repository ROOT, because npm workspaces resolve from the root
    # lockfile. Pointing Render at packages/backend would hide the workspace
    # layout and break dependency resolution.
    rootDir: .
    # `npm ci` installs devDependencies (typescript, @types/node, @types/pg)
    # which the TypeScript build requires. NODE_ENV is NOT set to production
    # at build time — that would trigger --omit=dev and remove the compiler.
    buildCommand: npm ci && npm run build --workspace @recoverai/backend
    # Migrations run at START, not at build: the build step has no access to
    # DATABASE_URL, and a released instance must apply pending migrations
    # before serving. `&&` short-circuits, so a failed migration aborts the
    # start and the old instance keeps serving instead of one with a missing
    # schema. The runner is idempotent (schema_migrations), so restarts and
    # scale-ups re-run it harmlessly.
    # The demo step between them is a no-op unless DEMO_MODE=true, and exits 0
    # even on failure, so it never blocks startup.
    startCommand: node packages/backend/dist/db/migrate.js && node packages/backend/dist/datasets/demo-cli.js && node packages/backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      # Set only at RUNTIME, never during build.
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      # PUBLIC HACKATHON DEMO POSTURE.
      #
      # Authentication is OFF so visitors need no API key. That is only
      # permitted because DEMO_MODE and ALLOW_MOCK_PROVIDERS_IN_PRODUCTION are
      # both set below: config refuses to start an unauthenticated production
      # service on real providers, so an open API can never touch real money.
      #
      # To return to a protected deployment: set AUTH_ENABLED=true, set
      # API_AUTH_TOKEN, and remove DEMO_MODE.
      - key: AUTH_ENABLED
        value: 'false'
      - key: DEMO_MODE
        value: 'true'
      - key: ALLOW_MOCK_PROVIDERS_IN_PRODUCTION
        value: 'true'
      # Generate with: openssl rand -hex 32   (min 16 characters)
      - key: API_AUTH_TOKEN
        sync: false
      # Exact origin of the static site below. No trailing slash, no wildcard.
      - key: CORS_ORIGINS
        sync: false
      # DEMO POSTURE: both providers are mocked.
      #
      # The mock AI provider is deterministic and calls no external model, so
      # the demo incurs NO API spend. The mock payment provider means no
      # recovery action ever reaches Razorpay.
      #
      # For a real deployment set these back to `gemini` / `razorpay` and
      # supply the credentials below (each is `sync: false`, so no secret is
      # ever committed to this file).
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      # Test-mode keys only. Startup fails on an rzp_live_ key by design.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend — Vite static site
  # ---------------------------------------------------------------------------
  - type: web
    name: recoverai-frontend
    runtime: static
    branch: main
    rootDir: .
    buildCommand: npm ci && npm run build --workspace @recoverai/frontend
    staticPublishPath: packages/frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      # Backend origin, inlined into the bundle at BUILD time. Changing it
      # requires a rebuild, not just a restart. PUBLIC — never put a token here.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: every unmatched path serves index.html so a deep link
      # such as /cases/abc123 reaches the React router instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: recoverai-db
    databaseName: recoverai
    user: recoverai
    plan: free
    region: singapore
